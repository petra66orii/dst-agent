version: "3.8"

services:
  # Scheduled jobs (daily signals, hourly radar, weekly scorecard) run in GitHub Actions.
  # Docker is only needed for the always-on Discord bot.
  # Discord Bot (always running)
  discord-bot:
    build: ..
    container_name: dst-discord-bot
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    restart: unless-stopped
    command: python -m src.server

  # Optional: Web dashboard (future enhancement)
