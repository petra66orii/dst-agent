name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt pytest
      - name: Import every module (no network)
        run: |
          python - <<'PY'
          import importlib
          for m in ["src.main", "src.dst_agent", "src.edgar", "src.radar", "src.scorecard",
                    "src.ledger", "src.llm", "src.market_data", "src.news_scraper", "src.send_report"]:
              importlib.import_module(m)
          print("OK")
          PY
      - run: python -m pytest -q
