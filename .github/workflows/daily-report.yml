name: Daily signals

on:
  schedule:
    # 22:15 UTC Mon-Fri = after the US close all year round (21:00 UTC in winter, 20:00 in summer)
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run daily analysis
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.main
      - name: Commit log and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/ data/signals.csv
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore: daily signals $(date -u +%F)"
          git pull --rebase
          git push
