name: Weekly scorecard

on:
  schedule:
    - cron: "45 22 * * 5"  # Friday, after the daily run
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Score signals vs benchmark
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.scorecard
