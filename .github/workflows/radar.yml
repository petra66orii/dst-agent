name: Event radar

on:
  schedule:
    # Hourly at :05 from 14:05 to 21:05 UTC, Mon-Fri (covers US market hours all year)
    - cron: "5 14-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      # Remembers which filings/moves were already alerted, without committing every hour
      - uses: actions/cache@v4
        with:
          path: |
            data/radar_state.json
            data/cik_map.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-
      - name: Scan watchlist
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.radar
